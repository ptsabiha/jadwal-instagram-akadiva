name: Pencatat Performa

# Tiap hari ±23.20 WIB (16.20 UTC) mencatat angka performa semua postingan ke performa/.
# Bisa juga dijalankan manual. Tidak menerbitkan apa pun.
on:
  schedule:
    - cron: '20 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pencatat-performa
  cancel-in-progress: false

jobs:
  catat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Catat performa
        run: node alat/catat-performa.mjs
        env:
          KUNCI_PRIVAT: ${{ secrets.KUNCI_PRIVAT }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
